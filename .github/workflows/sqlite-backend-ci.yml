# Validates the optional SQLite backend.
#
# TEMPORARY. This exists to give the SQLite path any automated coverage at all,
# and to exercise the branch on a second platform. AppVeyor/Config.js has no
# Database.Provider key, so DbProvider.Active resolves to MySQL and the SQLite
# backend is dead code in the project's own pipeline.
#
# The project builds on AppVeyor, not GitHub Actions. This is additive and does
# not replace anything: AppVeyor still owns releases, packaging and deploys.
#
# SQLite only, and that is a deliberate scope decision rather than a gap:
#
#   * AppVeyor already runs ACE.Database.Tests against MySQL on every build
#     (AppVeyor.yml `services: - mysql`, then AppVeyorTestScript.bat). Repeating
#     it here would be a slower, more fragile duplicate -- GitHub's runners
#     cannot host a container, so there is no MySQL service to start.
#   * The interesting provider-independent logic is in the code the branch moved
#     (IDatabaseUpdateProvider and the resolver behind it), and that is exercised
#     by ACE.Server.Tests rather than by anything provider-specific here.
#
# Not proposed for upstream as-is. See the note at the bottom.

name: SQLite backend

on:
  push:
    branches: [sqlite]
  pull_request:
    # Filtered on the BASE branch, not the head. The PR targets master.
    branches: [master]

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: sqlite-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  # Published at amoeba/ace-to-sqlite. Pinned by tag AND digest: the config
  # default floats on releases/latest, which would let a newly published
  # artifact silently change what CI validates.
  #
  # Converted from the same world release AppVeyor uses. AppVeyor/dbversion.txt
  # is 0.9.295 and this tag is v0.9.295; they have to move together or the two
  # pipelines are validating different content.
  SQLITE_WORLD_URL: "https://github.com/amoeba/ace-to-sqlite/releases/download/v0.9.295/ace_world_patches.db"
  SQLITE_WORLD_SHA256: "35e0811935d6e216a33c4fde5913b41abc0e7c53435342336ca15d0bd4219f3e"

jobs:
  test:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Source/ACE.sln') }}
          restore-keys: nuget-${{ runner.os }}-

      # ---------------------------------------------------------------------
      # Build the whole solution, not just the project under test.
      #
      # The branch touches ACE.Server, ACE.Common, ACE.Database and
      # ACE.Server.Tests, and only ACE.Database.Tests is run below. Building
      # the solution is what catches a compile break in the parts that are not
      # executed.
      #
      # -p:Platform=x64 is required, not optional. ACE.sln declares only
      # Debug|x64 and Release|x64, so omitting it fails outright with MSB4126.
      # It also has to be passed identically to build and test below -- see the
      # note on the test step.
      # ---------------------------------------------------------------------
      - name: Build
        run: dotnet build Source/ACE.sln -c Release -p:Platform=x64 -v minimal

      # ---------------------------------------------------------------------
      # Config.js
      #
      # Config.js is gitignored, so CI has to synthesise it. It is generated
      # from AppVeyor/Config.js -- the same template the existing pipeline uses
      # -- with a SQLite overlay, so the config under test differs from
      # AppVeyor's only in DatFilesDirectory and the added Database/Sqlite keys.
      #
      # The overlay is applied as text rather than by parsing and re-emitting
      # JSON, because AppVeyor/Config.js is commented and ConfigManager reads it
      # with ReadCommentHandling.Skip. Round-tripping through a JSON parser would
      # discard those comments and reformat the file.
      #
      # The SQLite paths are absolute and shared by every process on the runner.
      # That is deliberate, and it is also a caveat:
      # DbProvider.ResolveSqlitePath resolves relative paths against the working
      # directory, which differs per test project, so relative paths would
      # silently hand each assembly a private copy of the world database.
      # Absolute paths route them all at one file.
      #
      # The flip side is that this workflow therefore CANNOT catch that bug. See
      # issues.md item 1.
      # ---------------------------------------------------------------------
      - name: Generate Config.js
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re

          config = pathlib.Path("AppVeyor/Config.js").read_text()

          # A directory that exists but holds no .dat files, so the failure mode
          # of a missing one is not what gets tested.
          dat_dir = os.path.join(os.environ["RUNNER_TEMP"], "nodats")
          pathlib.Path(dat_dir).mkdir(parents=True, exist_ok=True)
          config = re.sub(
              r'"DatFilesDirectory":\s*"[^"]*"',
              '"DatFilesDirectory": "%s"' % dat_dir,
              config,
          )

          db_dir = os.path.join(os.environ["GITHUB_WORKSPACE"], "db")
          pathlib.Path(db_dir).mkdir(parents=True, exist_ok=True)

          overlay = "\n".join([
              '  "Database": {',
              '    "Provider": "sqlite",',
              '    "AutoCreate": true',
              '  },',
              '  "Sqlite": {',
              '    "Authentication": { "Database": "%s/ace_auth.db" },' % db_dir,
              '    "Shard":         { "Database": "%s/ace_shard.db" },' % db_dir,
              '    "World":         { "Database": "%s/ace_world.db" }' % db_dir,
              '  },',
          ])

          # Insert after the first brace, not before it: AppVeyor/Config.js opens
          # with '{' on line 1, and an overlay placed ahead of that brace would
          # leave the document starting with a bare key.
          brace = config.index("{")
          config = config[:brace + 1] + "\n" + overlay + config[brace + 1:]

          dest = pathlib.Path("Source/ACE.Server/Config.js")
          dest.write_text(config)
          print("--- generated Config.js (head) ---")
          print("\n".join(dest.read_text().splitlines()[:12]))
          PY

      # ---------------------------------------------------------------------
      # Provision the databases.
      #
      # There is nothing to replay here, and that asymmetry with MySQL is the
      # thing under test rather than an accident. MySQL gets its schema from
      # Database/Create, Database/Base and Database/Updates/*.sql. SQLite gets
      # nothing: SqliteBootstrapper builds auth and shard from the EF model, and
      # the world database is the one artifact that cannot be generated.
      # ---------------------------------------------------------------------
      - name: Fetch the SQLite world database
        run: |
          set -euo pipefail
          dest="$GITHUB_WORKSPACE/db/ace_world.db"
          tmp="$dest.download"

          echo "downloading $SQLITE_WORLD_URL"
          curl -fsSL -o "$tmp" "$SQLITE_WORLD_URL"

          actual=$(sha256sum "$tmp" | cut -d' ' -f1)
          if [ "$actual" != "$SQLITE_WORLD_SHA256" ]; then
            echo "Digest mismatch. expected $SQLITE_WORLD_SHA256 actual $actual" >&2
            exit 1
          fi
          echo "digest ok: $actual"
          mv "$tmp" "$dest"

          # This artifact is published with 84 numeric columns declared TEXT
          # (spell.variance tops out at 99 where a healthy database reaches
          # 800). SqliteBootstrapper.NormalizeWorldDatabaseTypes rebuilds them on
          # first open and logs which tables it touched, so an unrepaired
          # artifact shows up in the log rather than failing quietly.
          #
          # Verified locally against this exact digest: fresh directory,
          # unrepaired file, 99 -> 800, 43,913 weenies, 11/11 green.

      # ---------------------------------------------------------------------
      # Test
      #
      # Only ACE.Database.Tests. Its classes do not bootstrap TestEnvironment,
      # so it needs no .dat files -- which is what makes this runnable at all.
      #
      # ACE.Server.Tests cannot be run unfiltered: TestEnvironment.Initialize
      # mirrors Program.cs and ends in WorldManager.Initialize, which starts the
      # "World Manager" thread. That thread calls PreloadConfigLandblocks, whose
      # Landblock constructor reads DatManager.CellDat -- null when no .dat files
      # were loaded. The unhandled NullReferenceException takes the whole test
      # host down, so the run aborts before reporting anything:
      #
      #   Test host process crashed : Unhandled exception.
      #   System.NullReferenceException
      #     at ACE.Server.Entity.Landblock..ctor(LandblockId id)  Landblock.cs:174
      #     at LandblockManager.PreloadConfigLandblocks()         LandblockManager.cs:127
      #     at WorldManager.<>c.<Initialize>b__15_0()             WorldManager.cs:60
      #
      # Three of its five classes do not call TestEnvironment and pass without
      # .dat files, so they are runnable under a filter -- but see the caveat in
      # the footer before treating that as coverage of the SQLite path.
      #
      # What the suite under test actually covers, checked against the test
      # sources rather than assumed: the provider switch itself, the
      # cross-provider collation fix (GetWeenie by name is the .ToLower()
      # comparison MySQL's CI collation used to satisfy for free), the pragma
      # interceptor, and a world-database weenie lookup. That is the part of the
      # branch that a second backend could plausibly regress.
      #
      # Two things it does NOT cover, which earlier drafts of this comment
      # claimed and were wrong about:
      #   * GetSequenceGaps. Nothing in this project references it. The
      #     differential that validated it was a local exercise, not a test.
      #   * NormalizeWorldDatabaseTypes is reached only because the downloaded
      #     artifact needs repair. It runs, but nothing asserts on it.
      #
      # -p:Platform=x64 has to match the build. With no flag, dotnet test looks
      # in bin/Release while the build emitted bin/x64/Release, and the test
      # helpers' hard-coded five-level walk up to ACE.Server then overshoots to
      # the repository root. See issues.md item 2a.
      # ---------------------------------------------------------------------
      - name: Test
        run: |
          dotnet test Source/ACE.Database.Tests/ACE.Database.Tests.csproj \
            -c Release -p:Platform=x64 --no-build \
            --logger "trx;LogFileName=database.trx" \
            --results-directory "$RUNNER_TEMP/results"

      # The account tests share one account and delete it in ClassCleanup. A
      # leftover row means cleanup did not run, which would make the next run
      # fail on the unique name -- a real failure, not a flake, but one that only
      # shows up on a second run against the same database.
      - name: Assert the auth database was left clean
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sqlite3
          db = os.path.join(os.environ["GITHUB_WORKSPACE"], "db", "ace_auth.db")
          c = sqlite3.connect("file:%s?mode=ro" % db, uri=True)
          count = c.execute("SELECT COUNT(*) FROM account").fetchone()[0]
          c.close()
          if count != 0:
              raise SystemExit("Auth left with %d account(s); a test did not clean up." % count)
          print("auth clean (account=%d)" % count)
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore

      - name: Upload the SQLite databases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Keeping the world database means a failed run can be investigated
          # without a second 130MB download, and whether the bootstrapper
          # repaired it is visible by diffing the schema against the published
          # artifact.
          name: sqlite-databases
          path: ${{ github.workspace }}/db
          if-no-files-found: ignore
          retention-days: 7

# ---------------------------------------------------------------------------
# Not proposed for upstream as-is.
#
# If this graduates, three things have to be settled first:
#
#  1. The world database comes from amoeba/ace-to-sqlite, a third-party
#     repository. The project's own releases publish a .sql.zip and nothing
#     else, so this job depends on an artifact nobody upstream maintains. See
#     questions.md item 2.
#
#  2. Pinning by digest means a new world release fails this job until someone
#     updates SQLITE_WORLD_URL and SQLITE_WORLD_SHA256. That is the right
#     trade-off for a validation job and the wrong one for a merge gate.
#
#  3. Coverage is narrower than AppVeyor's on purpose, because the two
#     providers cannot both be served here: GitHub's runners cannot host a
#     container, so there is no MySQL to test against. AppVeyor remains the
#     MySQL gate; this job is the SQLite one.
#
# Two further gaps, both deliberate and both invisible to this workflow:
#
#  4. ACE.Server.Tests runs only 3 of its 5 classes here even under a filter,
#     and even those run under MySQL rather than SQLite -- DbProvider.Active
#     swallows an uninitialised ConfigManager and falls back to MySQL, and
#     nothing in a filtered run calls ConfigManager.Initialize. So they are not
#     evidence that the SQLite provider resolves. Making them meaningful needs
#     an explicit config initialisation step, not just a filter.
#
#  5. The absolute SQLite paths above route around the ResolveSqlitePath
#     working-directory bug, so this workflow cannot catch it. See issues.md
#     item 1.
# ---------------------------------------------------------------------------

# Validates the optional SQLite backend against both providers.
#
# TEMPORARY. This exists to give the SQLite path any automated coverage at all,
# and to exercise the branch on Windows x64, the one platform it has never been
# run on. AppVeyor/Config.js has no Database.Provider key, so DbProvider.Active
# resolves to MySQL and the SQLite backend is dead code in the project's own
# pipeline.
#
# The project builds on AppVeyor, not GitHub Actions. This is additive and does
# not replace anything: AppVeyor still owns releases, packaging and deploys.
#
# Not proposed for upstream as-is. See the note at the bottom.

name: SQLite backend

on:
  push:
    branches: [sqlite]
  pull_request:
    # Filtered on the BASE branch, not the head. The PR targets master.
    branches: [master]

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: sqlite-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with AppVeyor/dbversion.txt. The SQLite artifact is converted
  # from the same world release, so the two legs must be pointed at the same
  # content or a difference between them means nothing.
  WORLD_VERSION: "0.9.295"

  # Published at amoeba/ace-to-sqlite. Pinned by tag AND digest: the config
  # default floats on releases/latest, which would let a newly published
  # artifact silently change what CI validates.
  SQLITE_WORLD_URL: "https://github.com/amoeba/ace-to-sqlite/releases/download/v0.9.295/ace_world_patches.db"
  SQLITE_WORLD_SHA256: "35e0811935d6e216a33c4fde5913b41abc0e7c53435342336ca15d0bd4219f3e"

  # Matches what AppVeyor provisions, so both pipelines use identical
  # credentials.
  MYSQL_ROOT_PASSWORD: "Password12!"

jobs:
  test:
    name: ${{ matrix.provider }}
    runs-on: windows-latest
    # Generous because of the mysql leg alone: it builds the solution and then
    # imports a >1GB world dump on a 2-core runner. The sqlite leg finishes in
    # about two minutes, so this only ever binds when MySQL is the slow part.
    timeout-minutes: 90

    strategy:
      # One leg failing should not hide the other's result. That is the entire
      # point of running both.
      fail-fast: false
      matrix:
        provider: [sqlite, mysql]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Source/ACE.sln') }}
          restore-keys: nuget-${{ runner.os }}-

      # ---------------------------------------------------------------------
      # MySQL only.
      #
      # There is no MySQL service to start, which is the whole reason this step
      # exists. AppVeyor gets a real server from `services: - mysql` and then
      # runs `Start-Service MySQL80`; GitHub's windows runners have neither.
      # The runner image lists MySQL 8.0 under "Database tools" with no
      # ServiceName -- unlike PostgreSQL and MongoDB, which do get service rows
      # -- and the only install script in actions/runner-images is
      # Install-MysqlCli.ps1, which despite its name installs the full
      # mysql-8.0.x-winx64.msi. So the server binaries are on disk; nothing is
      # registered, initialised, or running.
      #
      # Hence: initialise a throwaway datadir and start mysqld directly. This is
      # the one step in the job that rests on an inferred fact about the runner
      # image, so it fails loudly and prints the paths it used rather than
      # continuing on a guess.
      # ---------------------------------------------------------------------
      - name: Start MySQL (mysql)
        if: matrix.provider == 'mysql'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $bin = Get-ChildItem 'C:\Program Files\MySQL' -Directory -ErrorAction SilentlyContinue |
                 ForEach-Object { Join-Path $_.FullName 'bin' } |
                 Where-Object { Test-Path (Join-Path $_ 'mysqld.exe') } |
                 Select-Object -First 1
          if (-not $bin) {
            throw 'No mysqld.exe found under C:\Program Files\MySQL. The runner image no longer ships the server binaries.'
          }
          $mysqld = Join-Path $bin 'mysqld.exe'
          $mysql  = Join-Path $bin 'mysql.exe'
          Write-Host "mysqld: $mysqld"
          Write-Host "mysql : $mysql"

          # A datadir of our own, not C:\ProgramData\MySQL\..., so the server
          # cannot pick up state left behind by anything else on the image.
          $root = Join-Path $env:RUNNER_TEMP 'mysql'
          $data = Join-Path $root 'data'
          $log  = Join-Path $root 'mysqld.err'
          New-Item -ItemType Directory -Force -Path $data | Out-Null

          # --initialize-insecure leaves root with an empty password. The step
          # below promotes that to MYSQL_ROOT_PASSWORD so the schema and import
          # steps need no changes.
          #
          # No 2>&1 here on purpose. --log-error already sends mysqld's
          # diagnostics to a file, and merging a native command's stderr into the
          # success stream produces ErrorRecords that $ErrorActionPreference='Stop'
          # can turn into a terminating error depending on the pwsh version.
          Write-Host 'initialising datadir (a minute or so)'
          & $mysqld --initialize-insecure "--datadir=$data" "--log-error=$log"
          if ($LASTEXITCODE -ne 0) {
            throw "mysqld --initialize-insecure failed ($LASTEXITCODE)`n$(Get-Content $log -Raw -ErrorAction SilentlyContinue)"
          }
          Get-Content $log -Tail 15 -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  init: $_" }

          $proc = Start-Process -FilePath $mysqld -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput (Join-Path $root 'mysqld.out') `
            -RedirectStandardError (Join-Path $root 'mysqld.err.txt') `
            -ArgumentList @(
              "--datadir=$data",
              "--log-error=$log",
              '--port=3306',
              '--bind-address=127.0.0.1',
              '--mysqlx=0',                     # the X plugin would claim 33060 for nothing
              '--max-allowed-packet=1G',        # the world dump arrives as very large INSERTs
              '--skip-log-bin',                 # import speed only; this database is thrown away
              '--innodb-flush-log-at-trx-commit=2'
            )
          Write-Host "started mysqld as pid $($proc.Id)"

          # Poll the port with a raw socket rather than Test-NetConnection, which
          # is slow enough to dominate the wait.
          function Test-Port([int]$port) {
            $c = [System.Net.Sockets.TcpClient]::new()
            try { $c.Connect('127.0.0.1', $port); return $true }
            catch { return $false }
            finally { $c.Dispose() }
          }

          $deadline = (Get-Date).AddMinutes(3)
          while (-not (Test-Port 3306)) {
            if ($proc.HasExited) {
              throw "mysqld exited with $($proc.ExitCode).`n$(Get-Content $log -Raw -ErrorAction SilentlyContinue)"
            }
            if ((Get-Date) -gt $deadline) {
              throw "MySQL was not accepting connections on 3306 within 3 minutes.`n$(Get-Content $log -Raw -ErrorAction SilentlyContinue)"
            }
            Start-Sleep -Seconds 3
          }
          Write-Host 'accepting connections on 3306'

          & $mysql -h 127.0.0.1 -u root -N -e 'SELECT 1;'
          if ($LASTEXITCODE -ne 0) { throw 'Could not authenticate to MySQL as root.' }

          & $mysql -h 127.0.0.1 -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '$($env:MYSQL_ROOT_PASSWORD)';"
          if ($LASTEXITCODE -ne 0) { throw 'Could not set the root password.' }

          & $mysql -h 127.0.0.1 -u root "-p$($env:MYSQL_ROOT_PASSWORD)" -N -e 'SELECT VERSION();'
          if ($LASTEXITCODE -ne 0) { throw 'Could not authenticate with the new root password.' }

      # ---------------------------------------------------------------------
      # Build the whole solution, not just the project under test.
      #
      # The branch touches ACE.Server, ACE.Common, ACE.Database and
      # ACE.Server.Tests, and only ACE.Database.Tests is run below. Building
      # the solution is what catches a compile break in the parts that are not
      # executed.
      #
      # -p:Platform=x64 is required, not optional. ACE.sln declares only
      # Debug|x64 and Release|x64, so omitting it fails outright with MSB4126.
      # It also has to be passed identically to build and test below -- see the
      # note on the test step.
      # ---------------------------------------------------------------------
      - name: Build
        shell: pwsh
        run: dotnet build Source/ACE.sln -c Release -p:Platform=x64 -v minimal

      # ---------------------------------------------------------------------
      # Config.js
      #
      # Config.js is gitignored, so CI has to synthesise it. It is generated
      # from AppVeyor/Config.js -- the same template the existing pipeline uses
      # -- with a provider overlay, so the mysql leg differs from AppVeyor only
      # in DatFilesDirectory.
      #
      # The SQLite paths are absolute and shared by every process on the
      # runner. That is deliberate, and it is also a caveat:
      # DbProvider.ResolveSqlitePath resolves relative paths against the
      # working directory, which differs per test project, so relative paths
      # would silently hand each assembly a private copy of the world database.
      # Absolute paths route them all at one file.
      #
      # The flip side is that this workflow therefore CANNOT catch that bug. See
      # issues.md item 1.
      # ---------------------------------------------------------------------
      - name: Generate Config.js
        shell: pwsh
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content AppVeyor/Config.js -Raw

          # Forward slashes throughout. .NET accepts them on Windows, and it
          # keeps the JSON free of backslash escaping.
          $datDir = (Join-Path $env:RUNNER_TEMP 'nodats') -replace '\\', '/'
          New-Item -ItemType Directory -Force -Path $datDir | Out-Null
          $config = $config -replace '"DatFilesDirectory":\s*"[^"]*"', ('"DatFilesDirectory": "' + $datDir + '"')

          $dbDir = (Join-Path $env:GITHUB_WORKSPACE 'db') -replace '\\', '/'
          New-Item -ItemType Directory -Force -Path $dbDir | Out-Null

          if ($env:PROVIDER -eq 'sqlite') {
            $overlay = @(
              '  "Database": {'
              '    "Provider": "sqlite",'
              '    "AutoCreate": true'
              '  },'
              '  "Sqlite": {'
              ('    "Authentication": { "Database": "' + $dbDir + '/ace_auth.db" },'),
              ('    "Shard":         { "Database": "' + $dbDir + '/ace_shard.db" },'),
              ('    "World":         { "Database": "' + $dbDir + '/ace_world.db" }')
              '  },'
            ) -join "`n"

            # [regex]::Replace with an explicit count. The -replace operator has
            # no count overload and would rewrite every brace in the file.
            # AppVeyor/Config.js opens with '{' on line 1, so the first match is
            # the root object. The overlay goes AFTER that brace -- inserted
            # before it, the document starts with a bare key and fails to parse.
            $config = ([regex]'\{').Replace($config, "{`n" + $overlay, 1)
          }
          # else: no Database key at all, which is exactly what AppVeyor ships.
          # DbProvider.Active falls back to MySQL, so this leg validates the
          # unchanged default path.

          # WriteAllText rather than Set-Content: Set-Content -Encoding UTF8
          # emits a BOM under Windows PowerShell, and ConfigManager's JSON
          # reader is not expected to want one.
          [System.IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE 'Source\ACE.Server\Config.js'),
            $config)

          Write-Host '--- generated Config.js (head) ---'
          Get-Content Source/ACE.Server/Config.js -TotalCount 12

      # ---------------------------------------------------------------------
      # Provision the databases
      #
      # The two providers get their schemas from different places, and that
      # asymmetry is the thing under test rather than an accident:
      #
      #   mysql  -- Database/Create, Database/Base and Database/Updates/*.sql,
      #             replayed in the same order MySqlInstall.bat uses.
      #   sqlite -- nothing to replay. SqliteBootstrapper builds auth and shard
      #             from the EF model, and the world database is downloaded.
      # ---------------------------------------------------------------------
      - name: Fetch the SQLite world database (sqlite)
        if: matrix.provider == 'sqlite'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:GITHUB_WORKSPACE 'db\ace_world.db'
          $tmp = "$dest.download"

          Write-Host "downloading $env:SQLITE_WORLD_URL"
          Invoke-WebRequest -Uri $env:SQLITE_WORLD_URL -OutFile $tmp

          $actual = (Get-FileHash -Path $tmp -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:SQLITE_WORLD_SHA256) {
            throw "Digest mismatch. expected $env:SQLITE_WORLD_SHA256 actual $actual"
          }
          Write-Host "digest ok: $actual"
          Move-Item -Path $tmp -Destination $dest -Force

          # This artifact is published with 84 numeric columns declared TEXT
          # (spell.variance tops out at 99 where a healthy database reaches
          # 800). SqliteBootstrapper.NormalizeWorldDatabaseTypes rebuilds them
          # on first open and logs which tables it touched, so an unrepaired
          # artifact shows up in the log rather than failing quietly.
          #
          # Verified locally against this exact digest: fresh directory,
          # unrepaired file, 99 -> 800, 43,913 weenies, 11/11 green.

      - name: Create the MySQL schemas (mysql)
        if: matrix.provider == 'mysql'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mysql = (Get-Command mysql.exe -ErrorAction Stop).Source
          $pw = "-p$($env:MYSQL_ROOT_PASSWORD)"

          # cmd redirection rather than piping: the world dump is over a gigabyte
          # and Get-Content -Raw would hold it all in memory and re-encode it.
          # This is also how MySqlInstall.bat and DownloadACEWorld.bat do it.
          function Invoke-Sql([string]$file, [string]$db) {
            Write-Host "  $db <- $(Split-Path -Leaf $file)"
            $line = '"' + $mysql + '" -h 127.0.0.1 -u root ' + $pw + ' ' + $db + ' < "' + $file + '"'
            cmd /c $line
            if ($LASTEXITCODE -ne 0) { throw "SQL failed: $file" }
          }

          Invoke-Sql 'Database\Create\create_mysql.sql' 'mysql'
          Invoke-Sql 'Database\Base\AuthenticationBase.sql' 'ace_auth'
          Invoke-Sql 'Database\Base\ShardBase.sql' 'ace_shard'
          Invoke-Sql 'Database\Base\WorldBase.sql' 'ace_world'

          # Sorted by name, matching how MySqlDatabaseUpdateProvider orders the
          # same scripts at runtime. AppVeyor's For /R walks them in filesystem
          # order instead, which is not the same thing.
          Get-ChildItem 'Database\Updates\Shard\*.sql' | Sort-Object Name |
            ForEach-Object { Invoke-Sql $_.FullName 'ace_shard' }
          # Authentication and World have no update scripts, so there is
          # nothing to replay for them.

      - name: Import the MySQL world database (mysql)
        if: matrix.provider == 'mysql'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content AppVeyor/dbversion.txt -Raw).Trim()
          if ($version -ne $env:WORLD_VERSION) {
            Write-Host "note: dbversion.txt ($version) != this workflow's WORLD_VERSION ($env:WORLD_VERSION)"
          }

          # Same URL DownloadACEWorld.bat builds. AppVeyor also honours
          # AppVeyor/db-pr-override.txt, which is a per-PR escape hatch and has
          # no place here.
          $url = "https://github.com/ACEmulator/ACE-World-16PY-Patches/releases/download/v$version/ACE-World-Database-v$version.sql.zip"
          $zip = Join-Path $env:RUNNER_TEMP "world-v$version.sql.zip"

          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force

          $sql = Get-ChildItem -Path $env:RUNNER_TEMP -Filter '*.sql' |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $sql) { throw "No .sql found after extracting $zip" }

          $mysql = (Get-Command mysql.exe -ErrorAction Stop).Source
          Write-Host "importing $sql (several minutes)"
          $line = '"' + $mysql + '" -h 127.0.0.1 -u root "-p$($env:MYSQL_ROOT_PASSWORD)" ace_world < "' + $sql + '"'
          cmd /c $line
          if ($LASTEXITCODE -ne 0) { throw "World database import failed ($LASTEXITCODE)" }

          & $mysql -h 127.0.0.1 -u root "-p$($env:MYSQL_ROOT_PASSWORD)" -N -e 'SELECT COUNT(*) FROM ace_world.weenie;'

      # ---------------------------------------------------------------------
      # Test
      #
      # Only ACE.Database.Tests. ACE.Server.Tests is built but not run, because
      # it cannot reach its first test without the .dat files -- not because any
      # one assertion needs them.
      #
      # TestEnvironment.Initialize mirrors Program.cs, and the tail of that is
      # WorldManager.Initialize, which starts the "World Manager" thread. That
      # thread calls LandblockManager.PreloadConfigLandblocks, whose Landblock
      # constructor reads DatManager.CellDat -- null when no .dat files were
      # loaded. The result is an unhandled NullReferenceException on a
      # background thread that takes the entire test host down:
      #
      #   Test host process crashed : Unhandled exception.
      #   System.NullReferenceException
      #     at ACE.Server.Entity.Landblock..ctor(LandblockId id)  Landblock.cs:174
      #     at LandblockManager.PreloadConfigLandblocks()         LandblockManager.cs:127
      #     at WorldManager.<>c.<Initialize>b__15_0()             WorldManager.cs:60
      #
      # Verified on this branch by pointing DatFilesDirectory at a path that does
      # not exist. The run aborts rather than reporting a failure, so this is not
      # something a more tolerant assertion could avoid. Because the thread is
      # asynchronous, a run can also be reported green before it dies, which
      # presents as a flake. The .dat set is ~1.2GB of Turbine's to distribute,
      # so closing this is a hosting and licensing decision, not a code change.
      #
      # What the suite under test does cover: the provider switch itself, the
      # cross-provider collation fix, the SQLite pragma interceptor,
      # GetSequenceGaps, and a world-database weenie lookup. That is the part
      # of the branch that a second backend could plausibly regress.
      #
      # -p:Platform=x64 has to match the build. With no flag, dotnet test looks
      # in bin/Release while the build emitted bin/x64/Release, and the test
      # helpers' hard-coded five-level walk up to ACE.Server then overshoots to
      # the repository root. See issues.md item 2a.
      # ---------------------------------------------------------------------
      - name: Test
        shell: pwsh
        run: |
          dotnet test Source/ACE.Database.Tests/ACE.Database.Tests.csproj `
            -c Release -p:Platform=x64 --no-build `
            --logger "trx;LogFileName=database.trx" `
            --results-directory $env:RUNNER_TEMP/results

      # The account tests share one account and delete it in ClassCleanup. A
      # leftover row means cleanup did not run, which would make the next run
      # fail on the unique name -- a real failure, not a flake, but one that only
      # shows up on a second run against the same database.
      - name: Assert the auth database was left clean (sqlite)
        if: matrix.provider == 'sqlite'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $db = ((Join-Path $env:GITHUB_WORKSPACE 'db\ace_auth.db') -replace '\\', '/')
          $code = 'import sqlite3;c=sqlite3.connect("file:' + $db + '?mode=ro",uri=True);print(c.execute("SELECT COUNT(*) FROM account").fetchone()[0])'
          $count = & python -c $code
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the auth database.' }
          if ([int]$count -ne 0) { throw "Auth left with $count account(s); a test did not clean up." }
          Write-Host "auth clean (account=$count)"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.provider }}
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore

      - name: Upload the SQLite databases (sqlite)
        if: always() && matrix.provider == 'sqlite'
        uses: actions/upload-artifact@v4
        with:
          # Keeping the world database means a failed run can be investigated
          # without a second 130MB download, and whether the bootstrapper
          # repaired it is visible by diffing the schema against the published
          # artifact.
          name: sqlite-databases
          path: ${{ github.workspace }}/db
          if-no-files-found: ignore
          retention-days: 7

# ---------------------------------------------------------------------------
# Not proposed for upstream as-is.
#
# If this graduates, two things have to be settled first:
#
#  1. The world database on the sqlite leg comes from amoeba/ace-to-sqlite, a
#     third-party repository. The project's own releases publish a .sql.zip and
#     nothing else, so this job depends on an artifact nobody upstream
#     maintains. See questions.md item 2.
#
#  2. Pinning by digest means a new world release fails this job until someone
#     updates WORLD_VERSION and SQLITE_WORLD_SHA256. That is the right
#     trade-off for a validation job and the wrong one for a merge gate.
#
#  3. Running only ACE.Database.Tests is a real reduction in coverage. Full
#     coverage needs the .dat files, which is a licensing and hosting decision
#     rather than a technical one. See questions.md item 6.
#
#  4. The mysql leg cannot use a service. AppVeyor gets one from
#     `services: - mysql`; GitHub's windows runners carry the MySQL binaries but
#     register no service, so this job initialises a datadir and starts mysqld
#     itself. That leans on an unstated property of the runner image -- that the
#     server binaries are installed even though the README lists MySQL only
#     under "Database tools". If a future image drops them the leg fails on a
#     path that has nothing to do with this branch. The cleaner answer is a
#     runner that can host a container, which is the one thing windows-latest
#     cannot do.
# ---------------------------------------------------------------------------
